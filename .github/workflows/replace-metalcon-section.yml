# Trigger de producción: 2026-08-04
name: Replace philosophy section with Metalcon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-metalcon-section.yml

permissions:
  contents: write

jobs:
  replace-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Metalcon section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8-sig')

          start_marker = '<!-- filosofía -->'
          end_marker = '<!-- servicios -->'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('No se encontró el bloque de filosofía para reemplazar')

          replacement = '''<!-- sistema Metalcon -->
<section class="section" id="filosofia">
  <div class="wrap">
    <div class="sec-head">
      <span class="num reveal">02 — Sistema constructivo</span>
      <h2 class="reveal">Metalcon: resistencia construida con <span class="serif-i">precisión</span></h2>
      <p class="lead reveal">Perfilería de acero galvanizado para viviendas livianas, eficientes y durables, diseñada según las exigencias de cada proyecto.</p>
    </div>
    <div class="phrase reveal">
      <span class="ph-num">I</span>
      <p>Su bajo peso reduce las cargas sísmicas y favorece una <em>respuesta estructural eficiente</em>.</p>
      <span class="ph-f">BAJO PESO · ALTA PRECISIÓN</span>
    </div>
    <div class="phrase reveal">
      <span class="ph-num">II</span>
      <p>Montaje en seco, piezas precisas y una obra <em>más rápida, ordenada y limpia</em>.</p>
      <span class="ph-f">CONSTRUCCIÓN EN SECO</span>
    </div>
    <div class="phrase reveal">
      <span class="ph-num">III</span>
      <p>Muros configurables para integrar <em>aislación térmica y acústica</em> según cada proyecto.</p>
      <span class="ph-f">CONFORT TÉRMICO Y ACÚSTICO</span>
    </div>
    <div class="phrase reveal">
      <span class="ph-num">IV</span>
      <p>El acero galvanizado protege la estructura y aporta una <em>durabilidad proyectada por décadas</em>.</p>
      <span class="ph-f">DURABILIDAD · ACERO GALVANIZADO</span>
    </div>
  </div>
</section>

'''

          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '<a class="mlink" href="#filosofia" style="transition-delay:.24s">Filosofía</a>',
              '<a class="mlink" href="#filosofia" style="transition-delay:.24s">Metalcon</a>'
          )
          text = text.replace(
              '<a href="#filosofia">Filosofía</a>',
              '<a href="#filosofia">Metalcon</a>'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate replacement
        run: |
          grep -q '02 — Sistema constructivo' index.html
          grep -q 'DURABILIDAD · ACERO GALVANIZADO' index.html
          grep -q '>Metalcon</a>' index.html

      - name: Commit production copy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: replace philosophy content with Metalcon benefits"
          git push origin HEAD:main

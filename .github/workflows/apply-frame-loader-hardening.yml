name: Apply frame loader hardening

on:
  push:
    branches:
      - fix/frame-cache-scroll
    paths:
      - .github/workflows/apply-frame-loader-hardening.yml

permissions:
  contents: write

jobs:
  patch-frame-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/frame-cache-scroll
          fetch-depth: 0

      - name: Harden progressive loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8-sig')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "const PRELOADER_SAFE = 15000;\nconst RETRIES = 3;",
              "const PRELOADER_SAFE = 12000;\nconst PRELOADER_HARD_STOP = 18000;\nconst MOBILE_VIEWPORT_DELTA = 180;\nconst RETRIES = 3;",
              'loader timing constants'
          )

          replace_once(
              "  failed: new Set(),\n  initialLoaded: 0,\n  frameIdx: 0,",
              "  failed: new Set(),\n  initialReady: new Set(),\n  initialSettled: new Set(),\n  frameIdx: 0,",
              'initial frame state'
          )

          replace_once(
              "function scheduleResize() {\n  clearTimeout(state.resizeTimer);\n  state.resizeTimer = setTimeout(() => {\n    sizeCanvas();\n    if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();\n  }, 140);\n}",
              "function scheduleResize(refreshLayout = false) {\n  const shouldRefresh = refreshLayout === true;\n  clearTimeout(state.resizeTimer);\n  state.resizeTimer = setTimeout(() => {\n    sizeCanvas();\n    scheduleDraw(state.frameIdx);\n    if (shouldRefresh && typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();\n  }, 140);\n}",
              'resize scheduler'
          )

          replace_once(
              "function updateInitialProgress() {\n  const pctEl = $('#ppct');\n  const hintEl = $('#phint');\n  const fillEl = $('#pfill');\n  const progress = clamp(state.initialLoaded / INITIAL_FRAME_COUNT, 0, 1);\n  if (pctEl) pctEl.textContent = String(Math.floor(progress * 100)).padStart(3, '0') + '%';\n  if (hintEl) hintEl.textContent = `${pad4(state.initialLoaded)} / ${pad4(INITIAL_FRAME_COUNT)} imágenes iniciales`;\n  if (fillEl) fillEl.style.transform = `scaleX(${progress})`;\n}",
              "function updateInitialProgress() {\n  const pctEl = $('#ppct');\n  const hintEl = $('#phint');\n  const fillEl = $('#pfill');\n  const ready = state.initialReady.size;\n  const progress = clamp(ready / INITIAL_FRAME_COUNT, 0, 1);\n  if (pctEl) pctEl.textContent = String(Math.floor(progress * 100)).padStart(3, '0') + '%';\n  if (hintEl) hintEl.textContent = `${pad4(ready)} / ${pad4(INITIAL_FRAME_COUNT)} imágenes iniciales`;\n  if (fillEl) fillEl.style.transform = `scaleX(${progress})`;\n}",
              'initial progress'
          )

          replace_once(
              "        if (index < INITIAL_FRAME_COUNT && !img.__countedInitial) {\n          img.__countedInitial = true;\n          state.initialLoaded++;\n          updateInitialProgress();\n        }",
              "        if (index < INITIAL_FRAME_COUNT) {\n          state.initialReady.add(index);\n          state.initialSettled.add(index);\n          updateInitialProgress();\n        }",
              'successful initial frame accounting'
          )

          replace_once(
              "        } else {\n          state.failed.add(index);\n          resolve(null);\n        }",
              "        } else {\n          state.failed.add(index);\n          if (index < INITIAL_FRAME_COUNT) {\n            state.initialSettled.add(index);\n            updateInitialProgress();\n          }\n          resolve(null);\n        }",
              'failed initial frame accounting'
          )

          replace_once(
              "async function preloadInitialFrames() {\n  updateInitialProgress();\n  await loadFrame(0, RETRIES, true);\n  scheduleDraw(0);\n\n  const queue = Array.from({ length: INITIAL_FRAME_COUNT - 1 }, (_, i) => i + 1);\n  const worker = async () => {\n    while (queue.length) {\n      const index = queue.shift();\n      await loadFrame(index, RETRIES, true);\n    }\n  };\n  await Promise.all(Array.from({ length: 4 }, worker));\n}",
              "async function preloadInitialFrames() {\n  updateInitialProgress();\n  const queue = Array.from({ length: INITIAL_FRAME_COUNT }, (_, i) => i);\n  const worker = async () => {\n    while (queue.length) {\n      const index = queue.shift();\n      await loadFrame(index, RETRIES, true);\n    }\n  };\n  await Promise.all(Array.from({ length: 4 }, worker));\n  scheduleDraw(0);\n}\n\nfunction retryMissingInitialFrames() {\n  for (let index = 0; index < INITIAL_FRAME_COUNT; index++) {\n    if (!state.initialReady.has(index)) queueFrame(index, 950 - index);\n  }\n}",
              'initial preloader workers'
          )

          replace_once(
              "    showCacheStatus(`Optimizando recursos visuales · ${INITIAL_FRAME_COUNT}/${FRAME_COUNT}`);",
              "    showCacheStatus(`Optimizando recursos visuales · ${state.initialReady.size}/${FRAME_COUNT}`);",
              'cache status initial count'
          )

          replace_once(
              "function initPreloader(registrationPromise) {\n  const el = $('#preloader');\n  const start = performance.now();\n\n  const close = () => {\n    if (state.preloaderClosed) return;\n    state.preloaderClosed = true;\n    el.classList.add('done');\n    setTimeout(() => {\n      state.ready = true;\n      if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();\n      startPersistentFrameCache(registrationPromise);\n    }, 850);\n  };\n\n  const tick = now => {\n    const elapsed = now - start;\n    const allInitialReady = state.initialLoaded >= INITIAL_FRAME_COUNT;\n    const safeFallback = elapsed >= PRELOADER_SAFE && !!state.frames[0];\n    if (allInitialReady || safeFallback) {\n      close();\n      return;\n    }\n    requestAnimationFrame(tick);\n  };\n  requestAnimationFrame(tick);\n}",
              "function initPreloader(registrationPromise) {\n  const el = $('#preloader');\n  const start = performance.now();\n\n  const close = () => {\n    if (state.preloaderClosed) return;\n    state.preloaderClosed = true;\n    el.classList.add('done');\n    setTimeout(() => {\n      state.ready = true;\n      requestFrameWindow(state.frameIdx, 1);\n      if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();\n      const beginCache = () => startPersistentFrameCache(registrationPromise);\n      if ('requestIdleCallback' in window) requestIdleCallback(beginCache, { timeout: 1800 });\n      else setTimeout(beginCache, 700);\n    }, 850);\n  };\n\n  const tick = now => {\n    const elapsed = now - start;\n    const readyCount = state.initialReady.size;\n    const allInitialReady = readyCount >= INITIAL_FRAME_COUNT;\n    const anyFrameReady = !!state.lastImage || state.frames.some(Boolean);\n    const safeFallback = elapsed >= PRELOADER_SAFE && anyFrameReady;\n    const terminalFallback = elapsed >= PRELOADER_HARD_STOP;\n\n    if (allInitialReady || safeFallback || terminalFallback) {\n      if (!allInitialReady) {\n        retryMissingInitialFrames();\n        if (anyFrameReady) scheduleDraw(state.frameIdx);\n        const missing = INITIAL_FRAME_COUNT - readyCount;\n        showCacheStatus(`Entrando con ${readyCount}/${INITIAL_FRAME_COUNT} imágenes listas · ${missing} continúan en segundo plano`, 5000);\n      }\n      close();\n      return;\n    }\n    requestAnimationFrame(tick);\n  };\n  requestAnimationFrame(tick);\n}",
              'preloader terminal fallback'
          )

          replace_once(
              "  const setup = () => {\n    const vhPerFrame = isCoarsePointer ? 5.2 : VH_PER_FRAME;\n    state.scrollTotal = FRAME_COUNT * vhPerFrame * window.innerHeight / 100;\n    reel.style.height = window.innerHeight + state.scrollTotal + 'px';\n  };\n  setup();",
              "  let layoutWidth = Math.round(window.innerWidth);\n  let layoutHeight = Math.round(window.innerHeight);\n  const setup = (force = false) => {\n    const nextWidth = Math.round(window.innerWidth);\n    const nextHeight = Math.round(window.innerHeight);\n    const widthChanged = Math.abs(nextWidth - layoutWidth) > 2;\n    const heightChanged = Math.abs(nextHeight - layoutHeight);\n    const shouldUpdate = force || !isCoarsePointer || widthChanged || heightChanged >= MOBILE_VIEWPORT_DELTA;\n    if (!shouldUpdate) return false;\n\n    layoutWidth = nextWidth;\n    layoutHeight = nextHeight;\n    const vhPerFrame = isCoarsePointer ? 5.2 : VH_PER_FRAME;\n    state.scrollTotal = FRAME_COUNT * vhPerFrame * layoutHeight / 100;\n    reel.style.height = layoutHeight + state.scrollTotal + 'px';\n    return true;\n  };\n  setup(true);",
              'stable reel viewport'
          )

          replace_once(
              "  window.addEventListener('resize', () => {\n    setup();\n    scheduleResize();\n  }, { passive: true });\n  if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize, { passive: true });",
              "  const handleViewportResize = () => {\n    const layoutChanged = setup(false);\n    scheduleResize(layoutChanged);\n  };\n  window.addEventListener('resize', handleViewportResize, { passive: true });\n  if (window.visualViewport) window.visualViewport.addEventListener('resize', handleViewportResize, { passive: true });\n  window.addEventListener('orientationchange', () => {\n    setTimeout(() => {\n      setup(true);\n      scheduleResize(true);\n    }, 180);\n  }, { passive: true });",
              'mobile viewport listeners'
          )

          replace_once(
              "  window.addEventListener('resize', scheduleResize, { passive: true });",
              "  window.addEventListener('resize', () => scheduleResize(false), { passive: true });",
              'boot resize listener'
          )

          replace_once(
              "  preloadInitialFrames();",
              "  preloadInitialFrames().catch(error => {\n    console.warn('No se pudo completar la precarga inicial:', error);\n  });",
              'preloader error handling'
          )

          replace_once(
              "  $('#contact-form').addEventListener('submit', contactSubmit);\n  requestFrameWindow(0, 1);",
              "  $('#contact-form').addEventListener('submit', contactSubmit);",
              'duplicate startup frame window'
          )

          replace_once(
              "window.__loaded = () => state.initialLoaded;",
              "window.__loaded = () => state.initialReady.size;",
              'debug loaded count'
          )

          replace_once(
              "  initialLoaded: state.initialLoaded,",
              "  initialLoaded: state.initialReady.size,\n  initialSettled: state.initialSettled.size,",
              'debug initial state'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: harden progressive frame loading"
          git push origin HEAD:fix/frame-cache-scroll

name: Apply production tuning

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-tune.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Improve startup speed and hero readability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8-sig')

          replacements = [
              ('const INITIAL_FRAME_COUNT = 20;', 'const INITIAL_FRAME_COUNT = 12;'),
              ('const PRELOADER_SAFE_MS = 12000;', 'const PRELOADER_SAFE_MS = 8000;'),
              ('const PRELOADER_HARD_STOP_MS = 18000;', 'const PRELOADER_HARD_STOP_MS = 12000;'),
              ('las primeras 20 imágenes', 'las primeras 12 imágenes'),
              ('primeras 20 imágenes', 'primeras 12 imágenes'),
          ]

          for old, new in replacements:
              text = text.replace(old, new)

          marker = '/* ================= ARRANQUE ================= */'
          if 'function injectHeroReadability()' not in text:
              block = r'''
function injectHeroReadability() {
  const style = document.createElement('style');
  style.id = 'hero-readability-fix';
  style.textContent = `
    #stage .vig {
      background:
        radial-gradient(95% 72% at 50% 47%, rgba(9,6,4,.08) 0%, rgba(9,6,4,.22) 36%, rgba(9,6,4,.58) 100%),
        linear-gradient(180deg, rgba(8,5,3,.72) 0%, rgba(8,5,3,.12) 26%, rgba(8,5,3,.16) 60%, rgba(8,5,3,.82) 100%) !important;
    }
    #hero::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(980px, 94vw);
      height: min(610px, 82vh);
      transform: translate(-50%, -50%);
      border-radius: 46px;
      background: radial-gradient(ellipse at center, rgba(12,8,5,.67) 0%, rgba(12,8,5,.45) 48%, rgba(12,8,5,.10) 78%, transparent 100%);
      filter: blur(.2px);
      pointer-events: none;
    }
    #hero > * { position: relative; z-index: 1; }
    #hero h1 {
      color: #F7F0E6;
      text-shadow: 0 2px 2px rgba(0,0,0,.96), 0 8px 28px rgba(0,0,0,.88), 0 18px 60px rgba(0,0,0,.72) !important;
    }
    #hero .serif-i {
      color: #F4EDE1 !important;
      text-shadow: 0 2px 2px rgba(0,0,0,.96), 0 8px 26px rgba(0,0,0,.86) !important;
    }
    #hero .tag {
      color: #EFE2CF !important;
      font-weight: 400;
      text-shadow: 0 2px 2px rgba(0,0,0,.95), 0 8px 24px rgba(0,0,0,.92) !important;
    }
    #hero .eyebrow {
      color: #FFD79D !important;
      text-shadow: 0 2px 2px rgba(0,0,0,.95), 0 6px 18px rgba(0,0,0,.9) !important;
    }
    @media (max-width: 760px) {
      #hero::before {
        width: 96vw;
        height: 78vh;
        border-radius: 30px;
        background: radial-gradient(ellipse at center, rgba(12,8,5,.76) 0%, rgba(12,8,5,.53) 52%, rgba(12,8,5,.14) 82%, transparent 100%);
      }
      #hero h1 {
        font-size: clamp(38px, 12.8vw, 62px) !important;
        line-height: 1.02;
      }
      #hero .tag {
        max-width: 92vw;
        font-size: 15px !important;
        line-height: 1.55;
      }
    }
  `;
  document.head.appendChild(style);
}

'''
              if marker not in text:
                  raise SystemExit('boot marker not found')
              text = text.replace(marker, block + marker, 1)

          boot_old = 'function boot() {\n  initResourceNotice();'
          boot_new = 'function boot() {\n  injectHeroReadability();\n  initResourceNotice();'
          if boot_old not in text:
              raise SystemExit('boot function signature not found')
          text = text.replace(boot_old, boot_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/production-tune.yml
          git add app.js
          git commit -m "fix: speed up initial frames and improve hero contrast"
          git push origin HEAD:main
